services:
  postgres:
    image: postgres:16-alpine
    container_name: aquariumos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aquariumos
      POSTGRES_USER: aquariumos
      POSTGRES_PASSWORD: aquariumos
    ports:
      - "5432:5432"
    volumes:
      - aquariumos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquariumos -d aquariumos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aquariumos_postgres_data:
